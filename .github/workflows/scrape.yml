name: Run Scraper

on:
  schedule:
    - cron: '0 4 * * *'   # 07:00 Istanbul (UTC+3)
    - cron: '0 10 * * *'  # 13:00 Istanbul (UTC+3)
  workflow_dispatch:

jobs:
  # The spider list is read from scraper/scraper/sources.py (enabled sources
  # only), so adding a source never means editing this file.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      spiders: ${{ steps.list.outputs.spiders }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: List enabled spiders
        id: list
        run: |
          cd scraper
          echo "spiders=$(python3 -m scraper.sources --slugs-json)" >> "$GITHUB_OUTPUT"
          python3 -m scraper.sources

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    # Per source, not for the whole run. One source is never legitimately this
    # slow, and a hung site can no longer eat the other sources' budget.
    timeout-minutes: 30
    strategy:
      # A dead site must not cancel the other sources' jobs.
      fail-fast: false
      # OpenRouter rate limits are the real ceiling; translate.MAX_WORKERS is 4.
      max-parallel: 4
      matrix:
        spider: ${{ fromJSON(needs.prepare.outputs.spiders) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run ${{ matrix.spider }} spider
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cd scraper
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Running ${{ matrix.spider }} spider"
          python3 -m scrapy crawl "${{ matrix.spider }}"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] ${{ matrix.spider }} complete"

  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: scrape
    # `fail-fast: false` alone is not enough: if any matrix job fails, the
    # `scrape` job result is "failure" and a plain `needs: scrape` would SKIP
    # this job. That is the exact failure this matrix exists to prevent, since
    # skipping translate leaves articles untranslated, unclassified and
    # untagged. Run whenever the workflow was not cancelled.
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Translate untranslated articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd scraper
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Retranslating untranslated articles"
          python3 -m scraper.retranslate
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Applying post-processing fixes"
          python3 -m scraper.postprocess_db
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Re-assigning hashtags and classification for missing articles"
          python3 -m scraper.rehash
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Translation complete"
